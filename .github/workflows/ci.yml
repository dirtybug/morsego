name: MorseGO CI/CD - Test, Build & Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - '*'
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  build-test:
    name: Test & Build in Docker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag Version for Android Store & Release
        id: versioning
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            IS_TAG_RELEASE="true"
          else
            TAG_NAME="development"
            IS_TAG_RELEASE="false"
          fi

          # Clean version without leading 'v' for Google Play Store (e.g. "1.0.0")
          CLEAN_VERSION="${TAG_NAME#v}"
          if [[ "$CLEAN_VERSION" == "development" ]]; then
            CLEAN_VERSION="1.0.0"
          fi

          # Calculate integer versionCode: Major * 10000 + Minor * 100 + Patch
          IFS='.' read -r -a PARTS <<< "$CLEAN_VERSION"
          MAJOR="${PARTS[0]:-1}"
          MINOR="${PARTS[1]:-0}"
          PATCH="${PARTS[2]:-0}"
          MAJOR=$(echo "$MAJOR" | sed 's/[^0-9]//g')
          MINOR=$(echo "$MINOR" | sed 's/[^0-9]//g')
          PATCH=$(echo "$PATCH" | sed 's/[^0-9]//g')
          MAJOR="${MAJOR:-1}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          MAJOR=$((10#$MAJOR))
          MINOR=$((10#$MINOR))
          PATCH=$((10#$PATCH))
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "VERSION=$TAG_NAME" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=$CODE" >> $GITHUB_ENV
          echo "IS_TAG_RELEASE=$IS_TAG_RELEASE" >> $GITHUB_ENV

          echo "====================================================="
          echo "🏷️ Git Tag / Version:     $TAG_NAME"
          echo "📱 Android Store Name:    $CLEAN_VERSION"
          echo "🔢 Android Store Code:    $CODE"
          echo "🚀 Is Tag Release:        $IS_TAG_RELEASE"
          echo "====================================================="

      - name: Validate Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${{ env.TAG_NAME }}"
          echo "Processing build for tag: '${TAG_NAME}'"

      - name: Update Android Manifest XML for Google Play Store
        run: |
          echo ">>> Updating app/src/main/AndroidManifest.xml with Play Store version ${{ env.APP_VERSION_NAME }} (code: ${{ env.APP_VERSION_CODE }})..."
          sed -i -E "s/android:versionName=\"[^\"]*\"/android:versionName=\"${{ env.APP_VERSION_NAME }}\"/g" app/src/main/AndroidManifest.xml
          sed -i -E "s/android:versionCode=\"[^\"]*\"/android:versionCode=\"${{ env.APP_VERSION_CODE }}\"/g" app/src/main/AndroidManifest.xml
          echo "Verified app/src/main/AndroidManifest.xml:"
          head -n 6 app/src/main/AndroidManifest.xml

      - name: Build Docker Container
        run: docker compose build

      - name: Run Tests and Build APKs in Docker
        run: |
          echo ">>> Running Tests and Building APKs in Docker (Version: ${{ env.APP_VERSION_NAME }}, Code: ${{ env.APP_VERSION_CODE }})..."
          APP_VERSION_NAME="${{ env.APP_VERSION_NAME }}" APP_VERSION_CODE="${{ env.APP_VERSION_CODE }}" docker compose run --rm test-all
          sudo chown -R $USER:$USER release/

      - name: Organize Release Artifacts
        run: |
          VERSION="${{ env.VERSION }}"
          echo "Organizing release artifacts for Version: ${VERSION}"

          if [[ "$IS_TAG_RELEASE" == "true" ]]; then
            TARGET_DIR="release/${VERSION}"
          else
            TARGET_DIR="release/development"
          fi
          mkdir -p "${TARGET_DIR}/reports"

          # 1. Ensure Release APK is present in TARGET_DIR
          if [ -f "release/development/morseGO-release.apk" ]; then
            cp "release/development/morseGO-release.apk" "${TARGET_DIR}/morseGO-release.apk"
          elif [ -f "release/development/morseGO-development-release.apk" ]; then
            cp "release/development/morseGO-development-release.apk" "${TARGET_DIR}/morseGO-release.apk"
          fi

          # 2. Ensure Test Reports are copied to TARGET_DIR
          if [ -d "release/development/reports" ] && [ "${TARGET_DIR}" != "release/development" ]; then
            cp -r release/development/reports/* "${TARGET_DIR}/reports/" 2>/dev/null || true
          fi

          # 3. Create a zip of test reports for easy download
          if [ -d "${TARGET_DIR}/reports" ]; then
            (cd "${TARGET_DIR}" && python3 -m zipfile -c test-reports.zip reports 2>/dev/null || zip -r test-reports.zip reports 2>/dev/null || true)
          fi

          echo "=== ARTIFACTS IN ${TARGET_DIR} ==="
          ls -lh "${TARGET_DIR}/"*.apk 2>/dev/null || true
          ls -lh "${TARGET_DIR}/test-reports.zip" 2>/dev/null || true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: morseGO-apk-${{ env.VERSION }}
          path: release/**/morseGO-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: morseGO-test-reports-${{ env.VERSION }}
          path: release/**/test-reports.zip
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release (on Tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "MorseGO ${{ env.VERSION }}"
          tag_name: ${{ env.VERSION }}
          body: |
            ## 🚀 MorseGO Official Release ${{ env.VERSION }}
            - **Google Play Store Version Name (`versionName`):** `${{ env.APP_VERSION_NAME }}`
            - **Google Play Store Version Code (`versionCode`):** `${{ env.APP_VERSION_CODE }}`
            - **Git Commit:** `${{ github.sha }}`
            - **Test Suite Status:** 100% Passed (Unit Tests & Behavior Tests)
          files: |
            release/${{ env.VERSION }}/morseGO-release.apk
            release/${{ env.VERSION }}/test-reports.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Release Metadata to Main Branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo ">>> Syncing new release ${{ env.VERSION }} metadata to main branch..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET_BRANCH="main"
          git fetch origin main:main 2>/dev/null || true
          git checkout "$TARGET_BRANCH"

          # 1. Update RELEASES.md with new release entry using python
          python3 - << 'EOF'
import sys, os
from datetime import datetime

version = os.environ.get('VERSION', 'v1.0.0')
app_version = os.environ.get('APP_VERSION_NAME', '1.0.0')
app_code = os.environ.get('APP_VERSION_CODE', '10000')
today = datetime.now().strftime('%Y-%m-%d')

entry = f"""## [{version}] - {today}

### 📱 Metadados Google Play Store
- **Nome da Versão (`versionName`):** `{app_version}`
- **Código da Versão (`versionCode`):** `{app_code}`

### 🧪 Testes e Qualidade
- **Suíte de Testes:** 100% de Aprovação
- **Relatório de Testes:** Disponível em `test-reports.zip`

### 📥 Artefatos de Instalação
| Artefato | Ficheiro | Descrição |
| :--- | :--- | :--- |
| **APK Release** | [`morseGO-release.apk`](https://github.com/dirtybug/morsego/releases/download/{version}/morseGO-release.apk) | Binário de produção Android |
| **Relatório de Testes** | [`test-reports.zip`](https://github.com/dirtybug/morsego/releases/download/{version}/test-reports.zip) | Relatório HTML dos testes |

---

"""
if os.path.exists('RELEASES.md'):
    with open('RELEASES.md', 'r', encoding='utf-8') as f:
        content = f.read()
    marker = '<!-- RELEASES_LIST_START -->\n'
    if marker in content and f'## [{version}]' not in content:
        idx = content.index(marker) + len(marker)
        new_content = content[:idx] + entry + content[idx:]
        with open('RELEASES.md', 'w', encoding='utf-8') as f:
            f.write(new_content)
EOF

          # 2. Update AndroidManifest.xml
          sed -i -E "s/android:versionName=\"[^\"]*\"/android:versionName=\"${{ env.APP_VERSION_NAME }}\"/g" app/src/main/AndroidManifest.xml
          sed -i -E "s/android:versionCode=\"[^\"]*\"/android:versionCode=\"${{ env.APP_VERSION_CODE }}\"/g" app/src/main/AndroidManifest.xml

          # 3. Only commit metadata files (never binary blobs or screenshot folders)
          git add RELEASES.md README.md app/src/main/AndroidManifest.xml 2>/dev/null || true
          git commit -m "chore(release): update metadata for ${{ env.VERSION }} [skip ci]" || true
          git push origin "$TARGET_BRANCH" || echo "Note: Push completed or skipped."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

