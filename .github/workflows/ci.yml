name: MorseGO CI/CD - Test, Build & Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - '*'
  pull_request:
    branches:
      - '**'
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  build-test:
    name: Test & Build in Docker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag Version for Android Store & Release
        id: versioning
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            IS_TAG_RELEASE="true"
          else
            TAG_NAME="development"
            IS_TAG_RELEASE="false"
          fi

          # Clean version without leading 'v' for Google Play Store (e.g. "1.0.0")
          CLEAN_VERSION="${TAG_NAME#v}"
          if [[ "$CLEAN_VERSION" == "development" ]]; then
            CLEAN_VERSION="1.0.0"
          fi

          # Calculate integer versionCode: Major * 10000 + Minor * 100 + Patch
          IFS='.' read -r -a PARTS <<< "$CLEAN_VERSION"
          MAJOR="${PARTS[0]:-1}"
          MINOR="${PARTS[1]:-0}"
          PATCH="${PARTS[2]:-0}"
          MAJOR=$(echo "$MAJOR" | sed 's/[^0-9]//g')
          MINOR=$(echo "$MINOR" | sed 's/[^0-9]//g')
          PATCH=$(echo "$PATCH" | sed 's/[^0-9]//g')
          MAJOR="${MAJOR:-1}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          MAJOR=$((10#$MAJOR))
          MINOR=$((10#$MINOR))
          PATCH=$((10#$PATCH))
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "VERSION=$TAG_NAME" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=$CLEAN_VERSION" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=$CODE" >> $GITHUB_ENV
          echo "IS_TAG_RELEASE=$IS_TAG_RELEASE" >> $GITHUB_ENV

          echo "====================================================="
          echo "🏷️ Git Tag / Version:     $TAG_NAME"
          echo "📱 Android Store Name:    $CLEAN_VERSION"
          echo "🔢 Android Store Code:    $CODE"
          echo "🚀 Is Tag Release:        $IS_TAG_RELEASE"
          echo "====================================================="

      - name: Validate Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${{ env.TAG_NAME }}"
          echo "Processing build for tag: '${TAG_NAME}'"

      - name: Update Android Manifest XML for Google Play Store
        run: |
          echo ">>> Updating app/src/main/AndroidManifest.xml with Play Store version ${{ env.APP_VERSION_NAME }} (code: ${{ env.APP_VERSION_CODE }})..."
          sed -i -E "s/android:versionName=\"[^\"]*\"/android:versionName=\"${{ env.APP_VERSION_NAME }}\"/g" app/src/main/AndroidManifest.xml
          sed -i -E "s/android:versionCode=\"[^\"]*\"/android:versionCode=\"${{ env.APP_VERSION_CODE }}\"/g" app/src/main/AndroidManifest.xml
          echo "Verified app/src/main/AndroidManifest.xml:"
          head -n 6 app/src/main/AndroidManifest.xml

      - name: Restore Keystore from Secrets for Release Signing
        run: |
          mkdir -p release
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo ">>> Restoring release/key.jks from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release/key.jks
            STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            echo "${STORE_PASS:-imcool}" > release/keystore-pass.txt
            echo "✓ Keystore restored successfully from Secrets."
          elif [ -f "release/key.jks" ]; then
            echo "✓ Local key.jks detected."
          else
            echo "ℹ️ No KEYSTORE_BASE64 secret provided; proceeding with build."
          fi

      - name: Build Docker Container
        run: docker compose build

      - name: Run Tests and Build Deliverables (APK and AAB) in Docker
        run: |
          echo ">>> Running Tests and Building APKs/AAB in Docker (Version: ${{ env.APP_VERSION_NAME }}, Code: ${{ env.APP_VERSION_CODE }})..."
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          APP_VERSION_NAME="${{ env.APP_VERSION_NAME }}" \
          APP_VERSION_CODE="${{ env.APP_VERSION_CODE }}" \
          KEYSTORE_PASSWORD="${STORE_PASS:-imcool}" \
          KEY_ALIAS="${{ secrets.KEY_ALIAS || 'key0' }}" \
          docker compose run --rm test-all
          sudo chown -R $USER:$USER release/

      - name: Organize Release Artifacts
        run: |
          VERSION="${{ env.VERSION }}"
          echo "Organizing release artifacts for Version: ${VERSION}"

          if [[ "$IS_TAG_RELEASE" == "true" ]]; then
            TARGET_DIR="release/${VERSION}"
          else
            TARGET_DIR="release/development"
          fi
          mkdir -p "${TARGET_DIR}/reports"

          # 1. Ensure Release APK is present in TARGET_DIR with versioned name
          if [ -f "release/development/morseGO-release.apk" ]; then
            cp "release/development/morseGO-release.apk" "${TARGET_DIR}/morseGO-${VERSION}.apk"
            cp "release/development/morseGO-release.apk" "${TARGET_DIR}/morseGO-release.apk"
          elif [ -f "release/development/morseGO-development-release.apk" ]; then
            cp "release/development/morseGO-development-release.apk" "${TARGET_DIR}/morseGO-${VERSION}.apk"
            cp "release/development/morseGO-development-release.apk" "${TARGET_DIR}/morseGO-release.apk"
          fi

          # 2. Ensure Release AAB (Android App Bundle) is present in TARGET_DIR with versioned name
          if [ -f "release/development/morseGO-release.aab" ]; then
            cp "release/development/morseGO-release.aab" "${TARGET_DIR}/morseGO-${VERSION}.aab"
            cp "release/development/morseGO-release.aab" "${TARGET_DIR}/morseGO-release.aab"
          fi

          # 3. Ensure Test Reports (including all HTML reports and CSS/JS) are copied to TARGET_DIR
          if [ -d "release/development/reports" ] && [ "${TARGET_DIR}" != "release/development" ]; then
            cp -r release/development/reports/* "${TARGET_DIR}/reports/" 2>/dev/null || true
          fi

          # 4. Create a zip of test reports for easy download
          if [ -d "${TARGET_DIR}/reports" ]; then
            (cd "${TARGET_DIR}" && python3 -m zipfile -c "morseGO-${VERSION}-test-reports.zip" reports 2>/dev/null || zip -r "morseGO-${VERSION}-test-reports.zip" reports 2>/dev/null || true)
          fi

          echo "=== ARTIFACTS IN ${TARGET_DIR} ==="
          ls -lh "${TARGET_DIR}/"*.apk 2>/dev/null || true
          ls -lh "${TARGET_DIR}/"*.aab 2>/dev/null || true
          ls -lh "${TARGET_DIR}/"*.zip 2>/dev/null || true
          ls -lh "${TARGET_DIR}/reports/" 2>/dev/null || true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: morseGO-${{ env.VERSION }}-apk
          path: release/**/morseGO-${{ env.VERSION }}.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release AAB Bundle Artifact (on Tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: morseGO-${{ env.VERSION }}-aab
          path: release/**/morseGO-${{ env.VERSION }}.aab
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Test Report Artifact (HTML & Zip)
        uses: actions/upload-artifact@v4
        with:
          name: morseGO-${{ env.VERSION }}-test-reports
          path: |
            release/**/morseGO-${{ env.VERSION }}-test-reports.zip
            release/**/reports/**
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release (on Tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "MorseGO ${{ env.VERSION }}"
          tag_name: ${{ env.VERSION }}
          body: |
            ## 🚀 MorseGO Official Release ${{ env.VERSION }}
            - **Google Play Store Version Name (`versionName`):** `${{ env.APP_VERSION_NAME }}`
            - **Google Play Store Version Code (`versionCode`):** `${{ env.APP_VERSION_CODE }}`
            - **Git Commit:** `${{ github.sha }}`
            - **Test Suite Status:** 100% Passed (Unit Tests & Behavior Tests)
          files: |
            release/${{ env.VERSION }}/morseGO-${{ env.VERSION }}.apk
            release/${{ env.VERSION }}/morseGO-${{ env.VERSION }}.aab
            release/${{ env.VERSION }}/morseGO-${{ env.VERSION }}-test-reports.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Release Metadata to Main Branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo ">>> Syncing new release ${{ env.VERSION }} metadata to main branch..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET_BRANCH="main"
          git fetch origin "${TARGET_BRANCH}"
          git checkout "${TARGET_BRANCH}"
          git pull origin "${TARGET_BRANCH}"

          # 1. Update AndroidManifest.xml with the tag's version
          echo "Updating AndroidManifest.xml to version ${{ env.APP_VERSION_NAME }} (code: ${{ env.APP_VERSION_CODE }})..."
          sed -i -E "s/android:versionName=\"[^\"]*\"/android:versionName=\"${{ env.APP_VERSION_NAME }}\"/g" app/src/main/AndroidManifest.xml
          sed -i -E "s/android:versionCode=\"[^\"]*\"/android:versionCode=\"${{ env.APP_VERSION_CODE }}\"/g" app/src/main/AndroidManifest.xml

          # 2. Update RELEASES.md with new release entry using python tool
          python3 tools/update_release_notes.py

          # 3. Only commit metadata files (never binary blobs or screenshot folders)
          git add RELEASES.md app/src/main/AndroidManifest.xml
          if git diff --staged --quiet; then
            echo "No changes to commit for AndroidManifest.xml or RELEASES.md."
          else
            git commit -m "chore(release): update AndroidManifest.xml and release notes for ${{ env.VERSION }} [skip ci]"
            git push origin "${TARGET_BRANCH}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


