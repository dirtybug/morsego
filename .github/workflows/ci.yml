name: MorseGO CI/CD - Test, Build & Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
      - '*'
  pull_request:
    branches:
      - master
      - main

jobs:
  build-test:
    name: Test & Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --info --stacktrace

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Behavior Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: |
            ./gradlew connectedDebugAndroidTest --info --stacktrace
            # Pull screenshots captured on emulator during behavior tests
            mkdir -p reports/screenshots/device_runs
            adb pull /sdcard/Android/data/com.morsego.app/files/Pictures/behavior_screenshots/. reports/screenshots/device_runs/ 2>/dev/null || true

      - name: Build Docker Container & Run Tests in Docker
        run: |
          docker compose build
          echo ">>> Running Unit Tests in Docker..."
          docker compose run --rm test-unit

      - name: Build Release & Debug APKs in Docker
        run: |
          echo ">>> Building Release APK in Docker..."
          docker compose run --rm build-release
          echo ">>> Building Debug APK in Docker..."
          docker compose run --rm build-apk

      - name: Organize Artifacts
        run: |
          mkdir -p release-artifacts/apk
          mkdir -p release-artifacts/reports
          mkdir -p release-artifacts/playstore
          
          # Copy generated APKs
          if [ -d "build-apks" ]; then
            cp build-apks/*.apk release-artifacts/apk/ 2>/dev/null || true
          fi
          find app/build/outputs/apk -name "*.apk" -exec cp {} release-artifacts/apk/ \; 2>/dev/null || true
          
          # Copy Unit Test reports
          mkdir -p release-artifacts/reports/unit-tests
          if [ -d "app/build/reports/tests/testDebugUnitTest" ]; then
            cp -r app/build/reports/tests/testDebugUnitTest/* release-artifacts/reports/unit-tests/
          fi

          # Copy Connected Behavior Test reports
          mkdir -p release-artifacts/reports/behavior-tests
          if [ -d "app/build/reports/androidTests/connected" ]; then
            cp -r app/build/reports/androidTests/connected/* release-artifacts/reports/behavior-tests/
          fi
          
          # Copy repository reports and screenshots
          if [ -d "reports" ]; then
            cp -r reports/* release-artifacts/reports/
          fi

          # Copy Play Store assets
          if [ -d "docs/playstore" ]; then
            cp -r docs/playstore/* release-artifacts/playstore/
          fi
          
          echo "Artifacts prepared successfully."
          ls -lh release-artifacts/apk/
          ls -lh release-artifacts/reports/
          ls -lh release-artifacts/playstore/

      - name: Upload APKs Artifact (Release & Debug)
        uses: actions/upload-artifact@v4
        with:
          name: morseGO-apks
          path: release-artifacts/apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Test Reports & Screenshots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: morseGO-test-reports
          path: release-artifacts/reports/
          retention-days: 30
          if-no-files-found: error

      - name: Upload Play Store Assets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: morseGO-playstore-assets
          path: release-artifacts/playstore/
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release (on Tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
