plugins {
    id 'com.android.application'
}

android {
    namespace 'com.morsego.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.morsego.app"
        minSdk 24
        targetSdk 34
        def appVersionName = project.hasProperty('versionName') ? project.property('versionName').toString() : (System.getenv("APP_VERSION_NAME") ?: "1.0.0")
        if (appVersionName.startsWith("v")) {
            appVersionName = appVersionName.substring(1)
        }

        def defaultCode = 1
        try {
            def parts = appVersionName.split('\\.')
            if (parts.length >= 3) {
                defaultCode = (parts[0].toInteger() * 10000) + (parts[1].toInteger() * 100) + parts[2].toInteger()
            } else if (parts.length == 2) {
                defaultCode = (parts[0].toInteger() * 10000) + (parts[1].toInteger() * 100)
            } else if (parts.length == 1 && parts[0].isInteger()) {
                defaultCode = parts[0].toInteger()
            }
        } catch (Exception ignored) {
            defaultCode = 1
        }

        def appVersionCode = project.hasProperty('versionCode') ? project.property('versionCode').toString().toInteger() : (System.getenv("APP_VERSION_CODE") ? System.getenv("APP_VERSION_CODE").toInteger() : defaultCode)

        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword(System.getenv("KEYSTORE_PASSWORD") ?: "morsego123")
            keyAlias(System.getenv("KEY_ALIAS") ?: "morsego")
            keyPassword(System.getenv("KEY_PASSWORD") ?: "morsego123")
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
